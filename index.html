<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Star</title>
<style>
:root {
  --accent:#4a9eff; --accent-hover:#3a8ee6;
  --bg:#0f1419; --bg-2:#16202c; --bg-3:#1a2332; --bg-4:#1e2a38;
  --border:#2a3441; --text:#e7e9ea; --text-dim:#8b98a5; --text-mute:#55606c;
  --danger:#ff4d4d; --danger-hover:#e63c3c;
  --bubble-out:#4a9eff; --bubble-out-text:#fff;
  --bubble-in:#1e2a38; --bubble-in-text:#e7e9ea;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-size:15px;
  --logo-color:#ffffff;
}
[data-theme="light"] {
  --bg:#f0f3f7; --bg-2:#ffffff; --bg-3:#e8edf3; --bg-4:#dde5ee;
  --border:#c9d3de; --text:#1a2332; --text-dim:#5a6878; --text-mute:#8b98a5;
  --bubble-in:#e8edf3; --bubble-in-text:#1a2332;
  --logo-color:#1a2332;
}
[data-theme="dark-gray"] {
  --bg:#1a1a1a; --bg-2:#242424; --bg-3:#2e2e2e; --bg-4:#383838;
  --border:#404040; --text:#e7e9ea; --text-dim:#999; --text-mute:#666;
}
[data-theme="light-gray"] {
  --bg:#ececec; --bg-2:#fafafa; --bg-3:#e0e0e0; --bg-4:#d0d0d0;
  --border:#c0c0c0; --text:#222; --text-dim:#666; --text-mute:#999;
  --bubble-in:#e0e0e0; --bubble-in-text:#222;
  --logo-color:#222;
}
[data-theme="dark-green"] {
  --bg:#0d1a12; --bg-2:#132820; --bg-3:#1a3428; --bg-4:#224232;
  --border:#2d5544; --text:#dff5e8; --text-dim:#7fb89a; --text-mute:#4a7864;
}
[data-theme="light-green"] {
  --bg:#e8f5ee; --bg-2:#ffffff; --bg-3:#d6ecdf; --bg-4:#c2e0cf;
  --border:#a8ceb8; --text:#14361f; --text-dim:#4a7864; --text-mute:#7fb89a;
  --bubble-in:#d6ecdf; --bubble-in-text:#14361f;
  --logo-color:#14361f;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; }
body { font-family:var(--font); background:var(--bg); color:var(--text);
  display:flex; height:100vh; height:100dvh; overflow:hidden; font-size:var(--font-size); }

/* Логотип */
.logo-svg { display:block; margin:0 auto; color:var(--logo-color); }
.logo-svg .star-path { fill:currentColor; }
.logo-svg .star-text { fill:currentColor; font-family:Georgia,"Times New Roman",serif; font-weight:400; letter-spacing:6px; }
.logo-big { width:140px; height:180px; }
.logo-small { width:36px; height:36px; }

/* Авторизация */
#authScreen { flex:1; display:flex; align-items:center; justify-content:center;
  padding:20px; background:var(--bg); overflow-y:auto; }
.auth-box { width:100%; max-width:420px; background:var(--bg-2);
  border-radius:16px; padding:32px 24px; box-shadow:0 10px 40px rgba(0,0,0,0.5); margin:auto; }
.auth-box .logo-wrap { margin-bottom:16px; }
.auth-box p.sub { text-align:center; color:var(--text-dim); font-size:13px; margin-bottom:24px; }
.tabs { display:flex; background:var(--bg); border-radius:10px; padding:4px; margin-bottom:20px; }
.tabs button { flex:1; padding:10px; border:none; background:transparent;
  color:var(--text-dim); font-size:14px; font-weight:600; border-radius:8px;
  cursor:pointer; transition:0.2s; font-family:inherit; }
.tabs button.active { background:var(--accent); color:#fff; }
.field { margin-bottom:14px; }
.field label { display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; font-weight:600; }
.field input, .field textarea, .field select { width:100%; padding:13px 14px;
  border:1px solid var(--border); background:var(--bg); border-radius:10px;
  color:var(--text); font-size:15px; outline:none; transition:0.2s;
  font-family:inherit; resize:vertical; }
.field input::placeholder, .field textarea::placeholder { color:var(--text-mute); }
.field input:focus, .field textarea:focus, .field select:focus { border-color:var(--accent); }
.btn { width:100%; padding:14px; border:none; border-radius:10px;
  background:var(--accent); color:#fff; font-size:15px; font-weight:700;
  cursor:pointer; margin-top:8px; transition:0.2s; font-family:inherit; }
.btn:hover { background:var(--accent-hover); }
.btn:active { transform:scale(0.98); }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
.btn.secondary { background:var(--border); color:var(--text); }
.btn.secondary:hover { background:var(--bg-4); }
.btn.danger { background:var(--danger); }
.btn.danger:hover { background:var(--danger-hover); }
.msg { text-align:center; font-size:13px; margin-top:14px; min-height:18px; }
.msg.error { color:var(--danger); } .msg.success { color:#4ade80; }
.msg.info { color:var(--accent); }

/* Основной интерфейс */
#appScreen { display:none; flex:1; width:100%; }
#appScreen.active { display:flex; }
.sidebar { width:360px; background:var(--bg-2); border-right:1px solid var(--border);
  display:flex; flex-direction:column; flex-shrink:0; }
.sidebar-tabs { display:flex; border-bottom:1px solid var(--border); background:var(--bg-2); }
.sidebar-tabs button { flex:1; padding:14px; border:none; background:transparent;
  color:var(--text-dim); font-size:13px; font-weight:600; cursor:pointer;
  border-bottom:2px solid transparent; transition:0.15s; font-family:inherit; }
.sidebar-tabs button.active { color:var(--accent); border-bottom-color:var(--accent); }
.sidebar-header { padding:14px 16px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; gap:10px; }
.user-block { display:flex; align-items:center; gap:10px; cursor:pointer; flex:1; min-width:0; }
.user-block .info { overflow:hidden; }
.user-block .info .name { font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.user-block .info .id { font-size:12px; color:var(--accent); font-weight:600; letter-spacing:1px; }
.avatar { width:44px; height:44px; border-radius:50%; background:var(--accent);
  display:flex; align-items:center; justify-content:center; font-weight:700;
  color:#fff; font-size:16px; flex-shrink:0; text-transform:uppercase;
  overflow:hidden; background-size:cover; background-position:center; }
.icon-btn { background:var(--border); border:none; color:var(--text-dim);
  padding:8px 10px; border-radius:8px; cursor:pointer; font-size:15px; flex-shrink:0; }
.icon-btn:hover { background:var(--bg-4); color:var(--text); }
.icon-btn.danger:hover { background:var(--danger); color:#fff; }
.icon-btn.admin { background:linear-gradient(135deg,#ff6b6b,#ffa726); color:#fff; }
.search-box { padding:12px 16px; border-bottom:1px solid var(--border); }
.search-box input { width:100%; padding:10px 14px; border-radius:20px;
  border:1px solid var(--border); background:var(--bg); color:var(--text);
  font-size:14px; outline:none; font-family:inherit; }
.search-box input::placeholder { color:var(--text-mute); }
.search-box input:focus { border-color:var(--accent); }
#searchResult { margin-top:10px; max-height:300px; overflow-y:auto; }
.tab-content { flex:1; overflow-y:auto; display:flex; flex-direction:column; }
.tab-content.hidden { display:none; }
.chat-item, .contact-item { padding:12px 16px; display:flex;
  align-items:center; gap:12px; cursor:pointer;
  border-bottom:1px solid var(--bg-3); transition:0.15s; }
.chat-item:hover, .contact-item:hover { background:var(--bg-3); }
.chat-item.active { background:var(--bg-4); border-left:3px solid var(--accent); }
.chat-info { flex:1; overflow:hidden; }
.chat-info .top { display:flex; justify-content:space-between; align-items:baseline; gap:6px; }
.chat-info .name { font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chat-info .time { font-size:11px; color:var(--text-dim); flex-shrink:0; }
.chat-info .last { font-size:13px; color:var(--text-dim); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; margin-top:2px;
  display:flex; align-items:center; gap:4px; }
.chat-info .last .check { color:var(--accent); font-size:12px; }
.unread-badge { background:var(--accent); color:#fff; border-radius:12px;
  padding:2px 7px; font-size:11px; font-weight:700; flex-shrink:0; }
.empty-hint { padding:40px 20px; text-align:center; color:var(--text-mute); font-size:13px; }

/* Посты */
.post { padding:14px 16px; border-bottom:1px solid var(--bg-3); }
.post-head { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.post-head .avatar { width:36px; height:36px; font-size:13px; cursor:pointer; }
.post-head .meta { flex:1; min-width:0; }
.post-head .meta .name { font-size:13px; font-weight:700; }
.post-head .meta .time { font-size:11px; color:var(--text-dim); }
.post-body { font-size:14px; line-height:1.5; margin-bottom:8px; word-wrap:break-word; white-space:pre-wrap; }
.post-image { max-width:100%; border-radius:10px; margin-top:6px; display:block; cursor:pointer; }
.post-actions { display:flex; gap:14px; margin-top:8px; font-size:13px; color:var(--text-dim); }
.post-actions button { background:none; border:none; color:var(--text-dim);
  cursor:pointer; font-size:13px; display:flex; align-items:center; gap:4px;
  padding:4px 0; font-family:inherit; }
.post-actions button:hover { color:var(--accent); }
.post-actions button.active { color:var(--accent); }
.post-actions button.danger:hover { color:var(--danger); }
.post-composer { padding:14px 16px; border-bottom:1px solid var(--border); background:var(--bg-3); }
.post-composer textarea { width:100%; padding:10px 12px; border-radius:10px;
  border:1px solid var(--border); background:var(--bg); color:var(--text);
  font-size:14px; outline:none; font-family:inherit; resize:vertical; min-height:60px; }
.post-composer .row { display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:8px; }
.post-composer .row .left { display:flex; gap:6px; }
.post-composer .row .left button { background:var(--border); border:none;
  color:var(--text-dim); padding:8px 12px; border-radius:8px; cursor:pointer; font-size:14px; }
.post-composer .row .left button:hover { background:var(--bg-4); color:var(--text); }
.post-composer .row .right button { background:var(--accent); border:none;
  color:#fff; padding:8px 20px; border-radius:8px; cursor:pointer;
  font-size:14px; font-weight:700; font-family:inherit; }
.post-preview { position:relative; margin-top:10px; display:inline-block; }
.post-preview img { max-width:140px; max-height:140px; border-radius:8px; display:block; }
.post-preview .remove { position:absolute; top:-8px; right:-8px; width:24px; height:24px;
  border-radius:50%; background:var(--danger); color:#fff; border:none;
  cursor:pointer; font-size:14px; line-height:1; }

/* Чат */
.chat-area { flex:1; display:flex; flex-direction:column; background:var(--bg);
  min-width:0; position:relative; }
.chat-header { padding:12px 16px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:12px; background:var(--bg-2); z-index:2; }
.chat-header .avatar { width:38px; height:38px; font-size:14px; }
.chat-header .info { flex:1; min-width:0; }
.chat-header .info .name { font-weight:700; font-size:15px; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; }
.chat-header .info .id { font-size:12px; color:var(--accent); font-weight:600; letter-spacing:1px; }
.back-btn { display:none; background:none; border:none; color:var(--accent);
  font-size:22px; cursor:pointer; padding:4px 8px; }
.messages { flex:1; overflow-y:auto; padding:18px; display:flex;
  flex-direction:column; gap:8px; background-size:cover; background-position:center; }
.msg-wrap { display:flex; flex-direction:column; max-width:75%; position:relative; }
.msg-wrap.out { align-self:flex-end; align-items:flex-end; }
.msg-wrap.in { align-self:flex-start; align-items:flex-start; }
.msg-bubble { padding:9px 13px; border-radius:16px; font-size:14px;
  line-height:1.4; word-wrap:break-word; position:relative; max-width:100%; }
.msg-bubble.out { background:var(--bubble-out); color:var(--bubble-out-text);
  border-bottom-right-radius:4px; }
.msg-bubble.in { background:var(--bubble-in); color:var(--bubble-in-text);
  border-bottom-left-radius:4px; }
.msg-bubble.deleted { font-style:italic; opacity:0.6; }
.msg-bubble img.chat-image { max-width:100%; border-radius:8px; display:block;
  margin-bottom:4px; cursor:pointer; max-height:300px; }
.msg-meta { font-size:10px; opacity:0.75; margin-top:3px;
  display:flex; gap:4px; align-items:center; justify-content:flex-end; }
.msg-bubble.edited .msg-meta::before { content:'изм.'; font-size:9px;
  opacity:0.7; margin-right:2px; }
.msg-actions { position:absolute; top:-6px; display:none; gap:2px;
  background:var(--bg-4); border-radius:6px; padding:2px;
  box-shadow:0 2px 8px rgba(0,0,0,0.4); z-index:5; }
.msg-wrap.out .msg-actions { right:100%; margin-right:6px; }
.msg-wrap.in .msg-actions { left:100%; margin-left:6px; }
.msg-wrap:hover .msg-actions { display:flex; }
.msg-actions button { background:none; border:none; color:var(--text-dim);
  cursor:pointer; padding:4px 6px; font-size:13px; border-radius:4px; }
.msg-actions button:hover { background:var(--border); color:var(--text); }
.msg-actions button.danger:hover { background:var(--danger); color:#fff; }
.edit-box { display:flex; gap:6px; align-items:center; padding:6px 0 0 0; }
.edit-box input { flex:1; padding:6px 10px; border-radius:8px;
  border:1px solid var(--border); background:var(--bg); color:var(--text);
  font-size:13px; outline:none; font-family:inherit; }
.edit-box button { padding:6px 10px; border-radius:6px; border:none;
  background:var(--border); color:#fff; cursor:pointer; font-size:12px; }
.edit-box button.ok { background:var(--accent); }
.no-chat { flex:1; display:flex; flex-direction:column; align-items:center;
  justify-content:center; color:var(--text-mute); font-size:14px;
  text-align:center; padding:20px; gap:20px; }
.input-bar { padding:12px 16px; border-top:1px solid var(--border);
  background:var(--bg-2); display:flex; gap:8px; align-items:flex-end; z-index:2; }
.input-bar .attach-btn { background:var(--border); border:none; color:var(--text-dim);
  width:42px; height:42px; border-radius:50%; cursor:pointer; font-size:18px;
  flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.input-bar .attach-btn:hover { background:var(--bg-4); color:var(--text); }
.input-bar input[type="text"] { flex:1; padding:12px 16px; border-radius:22px;
  border:1px solid var(--border); background:var(--bg); color:var(--text);
  font-size:15px; outline:none; font-family:inherit; }
.input-bar input[type="text"]::placeholder { color:var(--text-mute); }
.input-bar input[type="text"]:focus { border-color:var(--accent); }
.send-btn { width:46px; height:46px; border-radius:50%; border:none;
  background:var(--accent); color:#fff; font-size:18px; cursor:pointer;
  flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.send-btn:active { transform:scale(0.94); }
.blocked-banner { padding:12px 16px; background:var(--danger);
  color:#fff; text-align:center; font-size:13px; font-weight:600; display:none; }
.blocked-banner.show { display:block; }

/* Найденные пользователи */
.found-user { background:var(--bg-4); border-radius:10px; padding:10px;
  display:flex; align-items:center; gap:10px; cursor:pointer; margin-bottom:6px; }
.found-user:hover { background:var(--border); }
.found-user .avatar { width:36px; height:36px; font-size:13px; }
.found-user .meta { flex:1; overflow:hidden; }
.found-user .meta .name { font-size:13px; font-weight:600; }
.found-user .meta .id { font-size:11px; color:var(--accent); }
.found-user .actions { display:flex; gap:4px; }
.found-user .actions button { background:var(--border); border:none;
  color:var(--text-dim); padding:6px 10px; border-radius:6px;
  cursor:pointer; font-size:14px; }
.found-user .actions button:hover { background:var(--bg-4); color:var(--text); }

/* Контакты */
.contact-item .actions { display:flex; gap:4px; }
.contact-item .actions button { background:var(--border); border:none;
  color:var(--text-dim); padding:6px 10px; border-radius:6px;
  cursor:pointer; font-size:14px; }
.contact-item .actions button:hover { background:var(--bg-4); color:var(--text); }
.contact-item .actions button.danger:hover { background:var(--danger); color:#fff; }

/* Модалки */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7);
  display:none; align-items:center; justify-content:center;
  z-index:1000; padding:20px; overflow-y:auto; }
.modal-overlay.open { display:flex; }
.modal { background:var(--bg-2); border-radius:16px; padding:24px;
  width:100%; max-width:500px; max-height:90vh; overflow-y:auto;
  box-shadow:0 10px 40px rgba(0,0,0,0.6); }
.modal h2 { font-size:20px; margin-bottom:18px; color:var(--accent); }
.modal .close-row { display:flex; justify-content:flex-end; gap:8px;
  margin-top:18px; flex-wrap:wrap; }
.modal .close-row button { padding:10px 20px; border-radius:10px; border:none;
  cursor:pointer; font-size:14px; font-weight:600; font-family:inherit; }
.modal .close-row .cancel { background:var(--border); color:var(--text); }
.modal .close-row .save { background:var(--accent); color:#fff; }
.modal .close-row .save:hover { background:var(--accent-hover); }
.modal .close-row .danger { background:var(--danger); color:#fff; }
.modal .close-row .danger:hover { background:var(--danger-hover); }
.modal .info-row { display:flex; justify-content:space-between;
  padding:10px 0; border-bottom:1px solid var(--border); font-size:14px; }
.modal .info-row:last-of-type { border-bottom:none; }
.modal .info-row .label { color:var(--text-dim); }
.modal .info-row .value { font-weight:600; }
.settings-section { margin-bottom:22px; }
.settings-section h3 { font-size:13px; color:var(--text-dim);
  text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; font-weight:700; }

/* Аватар */
.avatar-picker { display:flex; gap:14px; align-items:center; margin-bottom:14px; }
.avatar-picker .avatar { width:80px; height:80px; font-size:28px;
  background-size:cover; background-position:center; }
.avatar-picker .btns { display:flex; flex-direction:column; gap:6px; }
.avatar-picker .btns button { padding:8px 14px; border-radius:8px; border:none;
  cursor:pointer; font-size:13px; background:var(--border);
  color:var(--text); font-family:inherit; }
.avatar-picker .btns button:hover { background:var(--bg-4); }

/* Темы */
.theme-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.theme-option { padding:12px; border-radius:10px; border:2px solid var(--border);
  cursor:pointer; text-align:center; font-size:13px; font-weight:600; transition:0.15s; }
.theme-option.selected { border-color:var(--accent); }
.color-grid { display:flex; gap:8px; flex-wrap:wrap; }
.color-swatch { width:36px; height:36px; border-radius:50%; cursor:pointer;
  border:3px solid transparent; transition:0.15s; }
.color-swatch.selected { border-color:var(--text); }
.font-options { display:flex; gap:6px; flex-wrap:wrap; }
.font-options button { padding:8px 14px; border-radius:8px;
  border:2px solid var(--border); background:transparent; color:var(--text);
  cursor:pointer; font-size:13px; font-family:inherit; }
.font-options button.selected { border-color:var(--accent); background:var(--bg-4); }
.font-size-row { display:flex; align-items:center; gap:12px; }
.font-size-row input[type="range"] { flex:1; }
.font-size-row span { min-width:40px; text-align:right; font-weight:600; }

/* Админ */
.admin-user-row { display:flex; align-items:center; gap:10px;
  padding:10px; border-bottom:1px solid var(--border); }
.admin-user-row .avatar { width:36px; height:36px; font-size:13px; }
.admin-user-row .meta { flex:1; min-width:0; }
.admin-user-row .meta .name { font-size:13px; font-weight:700; }
.admin-user-row .meta .id { font-size:11px; color:var(--accent); }
.admin-user-row .meta .status { font-size:11px; color:var(--danger); font-weight:600; }
.admin-user-row .actions { display:flex; gap:4px; }
.admin-user-row .actions button { background:var(--border); border:none;
  color:var(--text-dim); padding:6px 8px; border-radius:6px;
  cursor:pointer; font-size:12px; }
.admin-user-row .actions button:hover { background:var(--bg-4); color:var(--text); }
.admin-user-row .actions button.danger:hover { background:var(--danger); color:#fff; }
.admin-user-row .actions button.warn:hover { background:#ffa726; color:#000; }
.admin-user-row .actions button.good:hover { background:#4ade80; color:#000; }
.admin-chat-msg { padding:8px 10px; border-bottom:1px solid var(--border); font-size:13px; }
.admin-chat-msg .from { font-weight:700; color:var(--accent); font-size:12px; }
.admin-chat-msg .time { font-size:10px; color:var(--text-mute); float:right; }
.admin-chat-msg .text { margin-top:3px; word-wrap:break-word; }

/* Прочее */
.toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
  background:var(--bg-4); color:var(--text); padding:12px 22px;
  border-radius:10px; font-size:14px; z-index:2000;

function shiftColor(hex, amount) {
  try {
    let c = hex.replace('#','');
    if (c.length === 3) c = c.split('').map(x => x+x).join('');
    const num = parseInt(c, 16);
    const r = Math.max(0, Math.min(255, (num >> 16) + amount));
    const g = Math.max(0, Math.min(255, ((num >> 8) & 0xff) + amount));
    const b = Math.max(0, Math.min(255, (num & 0xff) + amount));
    return '#' + ((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
  } catch(e) { return hex; }
}

/* ============================================================

   ============================================================ */
async function getNextId() {
  const counterRef = ref(db, 'system/counter');
  const result = await runTransaction(counterRef, (current) => {
    if (!current) return { digit: START_DIGIT + 1, letterIdx: 0 };
    let { digit, letterIdx } = current;
    digit++;
    if (digit > END_DIGIT) {
      digit = START_DIGIT;
      letterIdx++;
      if (letterIdx >= LETTER_PAIRS.length) throw new Error('ID закончились');
    }
    return { digit, letterIdx };
  });
  if (!result.committed) throw new Error('Не удалось получить ID');
  const prev = result.snapshot.val();
  // Восстанавливаем предыдущее значение: если digit=START+1 и letterIdx=0 → был START,0
  // Но проще: то, что вернула транзакция — это НОВОЕ состояние.
  // А ID — это предыдущее. Считаем его из нового:
  let d = prev.digit - 1, l = prev.letterIdx;
  if (d < START_DIGIT) { d = END_DIGIT; l--; }
  if (l < 0) l = 0;
  let id = d + LETTER_PAIRS[l];
  // Проверка коллизии
  let attempts = 0;
  while (attempts < 100) {
    const snap = await get(ref(db, 'users/' + id));
    if (!snap.exists() && !(await get(ref(db, 'uids/' + id))).exists()) return { id, digit: d, letterIdx: l };
    // Коллизия — двигаем дальше
    d++;
    if (d > END_DIGIT) { d = START_DIGIT; l++; }
    if (l >= LETTER_PAIRS.length) throw new Error('ID закончились');
    id = d + LETTER_PAIRS[l];
    // Записываем обновлённый счётчик
    await set(counterRef, { digit: d + 1 > END_DIGIT ? START_DIGIT : d + 1, letterIdx: d + 1 > END_DIGIT ? l + 1 : l });
    attempts++;
  }
  throw new Error('Не удалось найти свободный ID');
}

      msg.textContent = 'Профиль не найден';
      await signOut(auth);
      btn.disabled = false; btn.textContent = 'Войти';
      return;
    }
    const userId = uidSnap.val();
    const userSnap = await get(ref(db, 'users/' + userId));
    const user = userSnap.val();
    if (!user) { msg.textContent = 'Профиль не найден'; await signOut(auth); btn.disabled = false; btn.textContent = 'Войти'; return; }
    if (user.frozen) {
      msg.textContent = '🚫 Аккаунт заморожен администратором';
      await signOut(auth);
      btn.disabled = false; btn.textContent = 'Войти';
      return;
    }
    currentUid = cred.user.uid;
    enterApp(user);
  } catch(e) {
    console.error(e);
    if (e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential')
      msg.textContent = 'Неверный email или пароль';
    else if (e.code === 'auth/too-many-requests') msg.textContent = 'Слишком много попыток. Подождите';
    else msg.textContent = 'Ошибка: ' + e.message;
    btn.disabled = false; btn.textContent = 'Войти';
  }
};

window.resendVerify = async function() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    await sendEmailVerification(cred.user);
    await signOut(auth);
    const msg = document.getElementById('loginMsg');
    msg.className = 'msg success';
    msg.textContent = '✓ Письмо отправлено повторно';
  } catch(e) { showToast('Ошибка: ' + e.message, true); }
};

window.logout = async function() {
  if (!confirm('Выйти из аккаунта?')) return;
  unsubscribers.forEach(u => u());
  await signOut(auth);
  location.reload();
};

function enterApp(user) {
  currentUser = user;
  applyTheme(user);
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appScreen').classList.add('active');
  applyUserToHeader();
  if (isAdmin()) document.getElementById('adminBtn').style.display = '';

  unsubscribers.forEach(u => u());
  unsubscribers = [];

  unsubscribers.push(onValue(ref(db, 'users'), snap => {
    usersCache = snap.val() || {};
    const fresh = usersCache[currentUser.id];
    if (fresh) { currentUser = fresh; applyUserToHeader(); }
    renderChats(); renderContacts(); renderPosts(); renderChat();
    if (document.getElementById('searchInput').value) searchUser();
  }));
  unsubscribers.push(onValue(ref(db, 'chats'), snap => {
    chatsCache = snap.val() || {};
    renderChats(); renderChat(); markAllRead();
  }));
  unsubscribers.push(onValue(ref(db, 'posts'), snap => {
    postsCache = snap.val() || {};
    renderPosts();
  }));
  unsubscribers.push(onValue(ref(db, 'users/' + currentUser.id), snap => {
    const u = snap.val();
    if (u) { currentUser = u; applyTheme(u); applyUserToHeader(); }
  }));
}

function applyUserToHeader() {
  if (!currentUser) return;
  document.getElementById('myName').textContent = currentUser.name;
  document.getElementById('myId').textContent = currentUser.id;
  const av = document.getElementById('myAvatar');
  if (currentUser.avatar) { av.style.backgroundImage = `url('${currentUser.avatar}')`; av.textContent = ''; }
  else { av.style.backgroundImage = ''; av.textContent = firstLetter(currentUser.name); }
}

window.searchUser = function() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const box = document.getElementById('searchResult');
  if (q.length < 1) { box.innerHTML = ''; return; }
  const results = Object.values(usersCache).filter(u => {
    if (u.id === currentUser.id) return false;
    return u.id.toLowerCase().includes(q) || u.name.toLowerCase().includes(q) || (u.email && u.email.toLowerCase().includes(q));
  }).slice(0, 20);
  if (results.length === 0) { box.innerHTML = '<div class="empty-hint" style="padding:10px 0">Никого не найдено</div>'; return; }
  box.innerHTML = results.map(u => {
    const avStyle = u.avatar ? ` style="background-image:url('${u.avatar}')"` : '';
    const avContent = u.avatar ? '' : escapeHtml(firstLetter(u.name));
    const inContacts = currentUser.contacts && currentUser.contacts[u.id];
    const frozen = u.frozen ? ' <span style="color:#ff6b6b">❄</span>' : '';
    return `
      <div class="found-user" data-id="${u.id}">
        <div class="avatar"${avStyle}>${avContent}</div>
        <div class="meta" data-open>
          <div class="name">${escapeHtml(u.name)}${frozen}</div>
          <div class="id">${u.id}</div>
        </div>
        <div class="actions">
          <button data-contact="${u.id}" title="${inContacts ? 'Убрать' : 'Добавить'}">${inContacts ? '★' : '☆'}</button>
          <button data-chat="${u.id}" title="Написать">💬</button>
        </div>
      </div>`;
  }).join('');
  box.querySelectorAll('.found-user').forEach(el => {
    const uid = el.dataset.id;
    el.querySelector('[data-open]').addEventListener('click', () => openUserProfile(uid));
    el.querySelector('[data-chat]').addEventListener('click', e => { e.stopPropagation(); openChat(uid); });
    el.querySelector('[data-contact]').addEventListener('click', e => { e.stopPropagation(); toggleContact(uid); });
  });
};

window.switchSidebarTab = function(tab) {
  ['chats','posts','contacts'].forEach(t => {
    document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle('active', t === tab);
    document.getElementById('content' + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle('hidden', t !== tab);
  });
};

window.toggleContact = async function(uid) {
  if (uid === currentUser.id) return;
  const other = usersCache[uid];
  if (!other) return;
  const contacts = currentUser.contacts || {};
  const path = `users/${currentUser.id}/contacts/${other.id}`;
  if (contacts[other.id]) { await remove(ref(db, path)); showToast('Удалён из контактов'); }
  else { await set(ref(db, path), true); showToast('Добавлен в контакты'); }
};

  if (!currentUser) return;

window.openChat = function(otherId) {
  if (isBlockedBy(otherId) && !isAdmin()) { showToast('Вы не можете писать этому пользователю', true); return; }
  activeChatId = otherId;
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResult').innerHTML = '';
  document.getElementById('chatArea').classList.add('open');
  renderChats(); renderChat(); markAllRead();
};
window.closeChat = function() {
  document.getElementById('chatArea').classList.remove('open');
  activeChatId = null; renderChat(); renderChats();
};
function markAllRead() {
  if (!activeChatId || !currentUser) return;
  const key = chatKey(currentUser.id, activeChatId);
  const msgs = chatsCache[key];
  if (!msgs) return;
  const updates = {}; let changed = false;
  Object.entries(msgs).forEach(([mid, m]) => { if (m.from === activeChatId && !m.read) { updates[`chats/${key}/${mid}/read`] = true; changed = true; } });
  if (changed) update(ref(db), updates);
}
window.toggleBlockUser = async function() {
  if (!activeChatId) return;
  const other = usersCache[activeChatId];
  if (!other) return;
  const blocked = iBlocked(activeChatId);
  if (blocked) { await remove(ref(db, `users/${currentUser.id}/blocked/${other.id}`)); showToast('Разблокирован'); }
  else {
    if (!confirm(`Заблокировать ${other.name}?`)) return;
    await set(ref(db, `users/${currentUser.id}/blocked/${other.id}`), true);
    showToast('Заблокирован');
  }
  renderChat();
};

function renderChats() {
  const list = document.getElementById('chatsList');
  if (!currentUser) return;
  const myId = currentUser.id;
  const partners = new Set();
  Object.keys(chatsCache).forEach(key => {
    const [a, b] = key.split('_');
    if (a === myId) partners.add(b);
    if (b === myId) partners.add(a);
  });
  Object.keys(currentUser.contacts || {}).forEach(id => { if (usersCache[id]) partners.add(id); });
  if (partners.size === 0) { list.innerHTML = '<div class="empty-hint">Пока нет чатов.<br>Найдите пользователя через поиск.</div>'; return; }
  const arr = [...partners].map(pid => {
    const key = chatKey(myId, pid);
    const msgsObj = chatsCache[key] || {};
    const msgs = Object.entries(msgsObj).map(([id, m]) => ({ id, ...m })).sort((a,b) => a.time - b.time);
    const last = msgs[msgs.length - 1];
    const unread = msgs.filter(m => m.from === pid && !m.read).length;
    return { pid, last, time: last ? last.time : 0, unread };
  }).sort((a,b) => b.time - a.time);
  list.innerHTML = arr.map(({ pid, last, unread }) => {
    const u = usersCache[pid];
    if (!u) return '';
    let preview = 'Нет сообщений'; let checkMark = '';
    if (last) {
      let body = last.deleted ? 'Сообщение удалено' : (last.text || (last.image ? '🖼 Картинка' : ''));
      if (last.from === myId) checkMark = last.read ? '<span class="check">✓✓</span>' : '<span class="check">✓</span>';
      preview = escapeHtml(body);
    }
    const timeStr = last ? formatTime(last.time) : '';
    const avStyle = u.avatar ? ` style="background-image:url('${u.avatar}')"` : '';
    const avContent = u.avatar ? '' : escapeHtml(firstLetter(u.name));
    const blockedIcon = iBlocked(pid) ? ' 🚫' : '';
    const frozenIcon = u.frozen ? ' ❄' : '';
    return `
      <div class="chat-item ${activeChatId === pid ? 'active' : ''}" data-id="${pid}">
        <div class="avatar"${avStyle}>${avContent}</div>
        <div class="chat-info">
          <div class="top">
            <span class="name">${escapeHtml(u.name)}${frozenIcon}${blockedIcon}</span>
            <span class="time">${timeStr}</span>
          </div>
          <div class="last">${checkMark}${preview}</div>
        </div>
        ${unread ? `<span class="unread-badge">${unread}</span>` : ''}
      </div>`;
  }).join('');
  list.querySelectorAll('.chat-item').forEach(el => el.addEventListener('click', () => openChat(el.dataset.id)));
}

function renderChat() {
  const noChat = document.getElementById('noChat');
  const header = document.getElementById('chatHeader');
  const messages = document.getElementById('messages');
  const inputBar = document.getElementById('inputBar');
  const banner = document.getElementById('blockedBanner');
  const blockBtn = document.getElementById('blockBtn');
  if (!activeChatId || !currentUser) {
    noChat.style.display = 'flex';
    header.style.display = 'none'; messages.style.display = 'none';
    inputBar.style.display = 'none'; banner.classList.remove('show');
    return;
  }
  const u = usersCache[activeChatId];
  if (!u) { activeChatId = null; renderChat(); return; }
  noChat.style.display = 'none';
  header.style.display = 'flex'; messages.style.display = 'flex';
  const blocked = iBlocked(activeChatId);
  const blockedByThem = isBlockedBy(activeChatId);
  banner.classList.toggle('show', blocked);
  inputBar.style.display = (blocked || blockedByThem) ? 'none' : 'flex';
  blockBtn.textContent = blocked ? '✅' : '🚫';
  const chatAv = document.getElementById('chatAvatar');
  if (u.avatar) { chatAv.style.backgroundImage = `url('${u.avatar}')`; chatAv.textContent = ''; }
  else { chatAv.style.backgroundImage = ''; chatAv.textContent = firstLetter(u.name); }
  document.getElementById('chatName').textContent = u.name + (u.frozen ? ' ❄' : '');
  document.getElementById('chatId').textContent = u.id;
  if (currentUser.wallpaper) {
    messages.style.backgroundImage = `linear-gradient(rgba(15,20,25,0.75), rgba(15,20,25,0.75)), url('${currentUser.wallpaper}')`;
  } else messages.style.backgroundImage = '';
  const key = chatKey(currentUser.id, activeChatId);
  const msgsObj = chatsCache[key] || {};
  const msgs = Object.entries(msgsObj).map(([id, m]) => ({ id, ...m })).sort((a,b) => a.time - b.time);
  messages.innerHTML = msgs.map(m => renderMessage(m)).join('');
  messages.scrollTop = messages.scrollHeight;
  messages.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const mid = el.dataset.mid;
      if (el.dataset.action === 'edit') startEditMessage(mid);
      if (el.dataset.action === 'delete') deleteMessage(mid);
    });
  });
  messages.querySelectorAll('.msg-bubble img.chat-image').forEach(img => img.addEventListener('click', () => openImageViewer(img.src)));
  messages.querySelectorAll('.msg-wrap').forEach(w => {
    w.addEventListener('click', () => {
      if (window.innerWidth <= 768) {
        messages.querySelectorAll('.msg-wrap.touched').forEach(x => { if (x !== w) x.classList.remove('touched'); });
        w.classList.toggle('touched');
      }
    });
  });
}

function renderMessage(m) {
  const isOut = m.from === currentUser.id;
  const dir = isOut ? 'out' : 'in';
  const deletedClass = m.deleted ? 'deleted' : '';
  const editedClass = m.edited && !m.deleted ? 'edited' : '';
  let contentHtml = '';
  if (m.deleted) contentHtml = '<em>Сообщение удалено</em>';
  else {
    if (m.image) contentHtml += `<img class="chat-image" src="${m.image}" alt="">`;
    if (m.text) contentHtml += `<div>${escapeHtml(m.text)}</div>`;
  }
  const checkHtml = isOut ? `<span>${m.read ? '✓✓' : '✓'}</span>` : '';
  const actions = (!m.deleted && isOut) ? `
    <div class="msg-actions">
      ${m.text ? `<button data-action="edit" data-mid="${m.id}" title="Изменить">✏</button>` : ''}
      <button data-action="delete" data-mid="${m.id}" class="danger" title="Удалить">🗑</button>
    </div>` : '';
  return `
    <div class="msg-wrap ${dir}">
      ${actions}
      <div class="msg-bubble ${dir} ${deletedClass} ${editedClass}">
        ${contentHtml}
        <div class="msg-meta">${checkHtml}<span>${formatTime(m.time)}</span></div>
      </div>
    </div>`;
}

window.sendMessage = async function() {
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if (!text || !activeChatId || !currentUser) return;
  if (iBlocked(activeChatId)) { showToast('Вы заблокировали пользователя', true); return; }
  if (isBlockedBy(activeChatId)) { showToast('Вы не можете писать этому пользователю', true); return; }
  const key = chatKey(currentUser.id, activeChatId);
  const newRef = push(ref(db, `chats/${key}`));
  input.value = '';
  try { await set(newRef, { from: currentUser.id, text, time: Date.now(), read: false }); }
  catch(e) { showToast('Ошибка: ' + e.message, true); }
};

function startEditMessage(mid) {
  const key = chatKey(currentUser.id, activeChatId);
  const m = chatsCache[key]?.[mid];
  if (!m || m.from !== currentUser.id || m.deleted) return;
  const wrap = document.getElementById('messages').querySelector(`[data-mid="${mid}"]`)?.closest('.msg-wrap');
  if (!wrap) return;
  const bubble = wrap.querySelector('.msg-bubble');
  bubble.innerHTML = `
    <div class="edit-box">
      <input type="text" value="${escapeHtml(m.text)}" id="editInput">
      <button class="ok" data-save>ОК</button>
      <button data-cancel>✕</button>
    </div>`;
  const inp = document.getElementById('editInput');
  inp.focus(); inp.select();
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') saveEdit(mid, inp.value.trim()); if (e.key === 'Escape') renderChat(); });
  bubble.querySelector('[data-save]').addEventListener('click', () => saveEdit(mid, inp.value.trim()));
  bubble.querySelector('[data-cancel]').addEventListener('click', () => renderChat());
}
async function saveEdit(mid, newText) {
  if (!newText) return;
  const key = chatKey(currentUser.id, activeChatId);
  await update(ref(db, `chats/${key}/${mid}`), { text: newText, edited: true });
}
async function deleteMessage(mid) {
  const key = chatKey(currentUser.id, activeChatId);
  const m = chatsCache[key]?.[mid];
  if (!m || m.from !== currentUser.id) return;
  if (!confirm('Удалить сообщение?')) return;
  await update(ref(db, `chats/${key}/${mid}`), { deleted: true, text: '', image: '' });
}

      <button class="cancel" onclick="closeModal()">Закрыть</button>
      <button class="save" onclick="saveProfile()">Сохранить</button>
    </div>`;
  document.getElementById('modalOverlay').classList.add('open');
  document.querySelectorAll('[data-theme]').forEach(el => el.addEventListener('click', async () => {
    await update(ref(db, 'users/' + currentUser.id), { theme: el.dataset.theme });
    showToast('Тема применена');
  }));
  document.querySelectorAll('[data-accent]').forEach(el => el.addEventListener('click', async () => {
    await update(ref(db, 'users/' + currentUser.id), { accent: el.dataset.accent });
    showToast('Акцент изменён');
  }));
  document.querySelectorAll('[data-bubble]').forEach(el => el.addEventListener('click', async () => {
    const patch = {}; patch[el.dataset.bubble === 'out' ? 'bubbleOut' : 'bubbleIn'] = el.dataset.color;
    await update(ref(db, 'users/' + currentUser.id), patch);
    showToast('Цвет изменён');
  }));
  document.querySelectorAll('[data-font]').forEach(el => el.addEventListener('click', async () => {
    await update(ref(db, 'users/' + currentUser.id), { font: el.dataset.font });
    showToast('Шрифт изменён');
  }));
};
window.setFontSize = function(size) {
  document.getElementById('fontSizeLabel').textContent = size + 'px';
  update(ref(db, 'users/' + currentUser.id), { fontSize: parseInt(size) });
};
window.pickAvatarImage = function() { document.getElementById('fileInputAvatar').click(); };
document.getElementById('fileInputAvatar').addEventListener('change', async (e) => {
  const f = e.target.files[0]; if (!f) return; e.target.value = '';
  showLoading(true, 'Загрузка аватара...');
  try {
    const url = await uploadToImgBB(f); avatarPendingImage = url;
    const prev = document.getElementById('avatarPreview');
    if (prev) { prev.style.backgroundImage = `url('${url}')`; prev.textContent = ''; }
    showToast('Аватар загружен');
  } catch(err) { showToast('Ошибка: ' + err.message, true); }
  finally { showLoading(false); }
});
window.removeAvatar = function() {
  avatarPendingImage = '';
  const prev = document.getElementById('avatarPreview');
  if (prev) { prev.style.backgroundImage = ''; prev.textContent = firstLetter(currentUser.name); }
};
window.pickWallpaperImage = function() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    showLoading(true, 'Загрузка обоев...');
    try {
      const url = await uploadToImgBB(f); wallpaperPendingImage = url;
      document.getElementById('setWallpaper').value = url;
      showToast('Обои загружены');
    } catch(err) { showToast('Ошибка: ' + err.message, true); }
    finally { showLoading(false); }
  });
  inp.click();
};
window.saveProfile = async function() {
  const name = document.getElementById('setName').value.trim();
  const wallpaper = document.getElementById('setWallpaper').value.trim();
  if (!name) { showToast('Имя не может быть пустым', true); return; }
  const patch = { name, avatar: avatarPendingImage || '', wallpaper: wallpaper || wallpaperPendingImage || '' };
  try { await update(ref(db, 'users/' + currentUser.id), patch); showToast('Профиль сохранён'); closeModal(); }
  catch(e) { showToast('Ошибка: ' + e.message, true); }
};
window.deleteAccount = async function() {
  if (isAdmin()) { showToast('Нельзя удалить аккаунт администратора', true); return; }
  if (!confirm('⚠️ Удалить аккаунт навсегда?\nВсе данные будут стёрты.')) return;
  if (!confirm('Точно удалить? Необратимо.')) return;
  const myId = currentUser.id;
  showLoading(true, 'Удаление аккаунта...');
  try {
    const updates = {};
    Object.keys(chatsCache).forEach(key => { if (key.includes(myId)) updates['chats/' + key] = null; });
    Object.entries(postsCache).forEach(([pid, p]) => { if (p.authorId === myId) updates['posts/' + pid] = null; });
    Object.values(usersCache).forEach(u => {
      if (u.contacts && u.contacts[myId]) updates[`users/${u.id}/contacts/${myId}`] = null;
      if (u.blocked && u.blocked[myId]) updates[`users/${u.id}/blocked/${myId}`] = null;
    });
    updates['users/' + myId] = null;
    updates['uids/' + currentUid] = null;
    updates['email_to_id/' + (currentUser.email || '').toLowerCase()] = null;
    await update(ref(db), updates);
    try { if (auth.currentUser) await deleteUser(auth.currentUser); } catch(e) { console.warn(e); }
    showToast('Аккаунт удалён');
    setTimeout(() => location.reload(), 1000);
  } catch(e) { showToast('Ошибка: ' + e.message, true); showLoading(false); }
};
window.openWallpaperSettings = function() {
  if (!activeChatId) return;
  wallpaperPendingImage = currentUser.wallpaper || '';
  document.getElementById('modalContent').innerHTML = `
    <h2>Обои чата</h2>
    <div class="field"><label>Ссылка</label>
      <input type="text" id="wpUrl" value="${currentUser.wallpaper && !currentUser.wallpaper.startsWith('data:') ? escapeHtml(currentUser.wallpaper) : ''}" placeholder="https://...">
    </div>
    <button class="btn secondary" onclick="pickWallpaperImage()">Загрузить картинку</button>
    <div class="close-row">
      <button class="cancel" onclick="closeModal()">Отмена</button>
      <button class="save" onclick="applyWallpaper()">Применить</button>
    </div>`;
  document.getElementById('modalOverlay').classList.add('open');
};
window.applyWallpaper = async function() {
  const url = document.getElementById('wpUrl').value.trim();
  const final = url || wallpaperPendingImage || '';
  await update(ref(db, 'users/' + currentUser.id), { wallpaper: final });
  closeModal(); showToast('Обои обновлены');
};

/* ============================================================
   ПРОФИЛЬ ДРУГОГО
   ============================================================ */
window.openUserProfile = function(id) {
  if (!id) return;
  const u = usersCache[id];
  if (!u) return;
  if (isBlockedBy(id) && !isAdmin()) { showToast('Профиль недоступен', true); return; }
  const avStyle = u.avatar ? ` style="background-image:url('${u.avatar}')"` : '';
  const avContent = u.avatar ? '' : escapeHtml(firstLetter(u.name));
  const canMessage = u.id !== currentUser.id;
  const inContacts = currentUser.contacts && currentUser.contacts[u.id];
  const iBlockedHim = iBlocked(u.id);
  document.getElementById('modalContent').innerHTML = `
    <h2>Профиль</h2>
    <div class="avatar-picker" style="justify-content:center">
      <div class="avatar"${avStyle} style="width:80px;height:80px;font-size:28px">${avContent}</div>
    </div>
    <div class="info-row"><span class="label">Имя</span><span class="value">${escapeHtml(u.name)}</span></div>
    <div class="info-row"><span class="label">ID</span><span class="value">${u.id}</span></div>
    ${u.frozen ? '<div class="info-row"><span class="label" style="color:var(--danger)">Статус</span><span class="value" style="color:var(--danger)">❄ Заморожен</span></div>' : ''}
    ${u.role === 'admin' ? '<div class="info-row"><span class="label">Роль</span><span class="value" style="color:#ffa726">🛡 Админ</span></div>' : ''}
    <div class="info-row"><span class="label">В Star с</span><span class="value">${new Date(u.createdAt).toLocaleDateString()}</span></div>
    <div class="close-row" style="flex-wrap:wrap;gap:6px">
      <button class="cancel" onclick="closeModal()">Закрыть</button>
      ${canMessage ? `
        <button class="save" onclick="toggleContact('${u.id}'); closeModal();">${inContacts ? '★ Убрать' : '☆ В контакты'}</button>
        <button class="danger" onclick="blockFromProfile('${u.id}')">${iBlockedHim ? '✅ Разблок.' : '🚫 Блок.'}</button>
        <button class="save" onclick="closeModal(); openChat('${u.id}')">Написать</button>
      ` : ''}
    </div>`;
  document.getElementById('modalOverlay').classList.add('open');
};
window.blockFromProfile = async function(id) {
  const other = usersCache[id]; if (!other) return;
  const blocked = iBlocked(id);
  if (blocked) { await remove(ref(db, `users/${currentUser.id}/blocked/${other.id}`)); showToast('Разблокирован'); }
  else { await set(ref(db, `users/${currentUser.id}/blocked/${other.id}`), true); showToast('Заблокирован'); }
  closeModal();
};

/* ============================================================
   ПОСТЫ
   ============================================================ */
window.pickPostImage = function() { document.getElementById('fileInputPost').click(); };
document.getElementById('fileInputPost').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return; e.target.value = '';
  showLoading(true, 'Загрузка картинки...');
  try { postPendingImage = await uploadToImgBB(f); renderPostPreview(); }
  catch(err) { showToast('Ошибка: ' + err.message, true); }
  finally { showLoading(false); }
});
function renderPostPreview() {
  const box = document.getElementById('postPreviewBox');
  if (!postPendingImage) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="post-preview"><img src="${postPendingImage}"><button class="remove" onclick="removePostImage()">✕</button></div>`;
}
window.removePostImage = function() { postPendingImage = null; renderPostPreview(); };
window.publishPost = async function() {
  const text = document.getElementById('postText').value.trim();
  if (!text && !postPendingImage) { showToast('Напишите что-нибудь', true); return; }
  const newRef = push(ref(db, 'posts'));
  try {
    await set(newRef, { authorId: currentUser.id, text, image: postPendingImage || '', likes: {}, time: Date.now() });
    document.getElementById('postText').value = ''; postPendingImage = null; renderPostPreview();
    showToast('Опубликовано');
  } catch(e) { showToast('Ошибка: ' + e.message, true); }
};
function renderPosts() {
  const list = document.getElementById('postsList');
  if (!list || !currentUser) return;
  const posts = Object.entries(postsCache).map(([id, p]) => ({ id, ...p })).sort((a,b) => b.time - a.time);
  if (posts.length === 0) { list.innerHTML = '<div class="empty-hint">Пока нет постов.<br>Будьте первым!</div>'; return; }
  list.innerHTML = posts.map(p => {
    const author = usersCache[p.authorId];
    if (!author) return '';
    const isMine = p.authorId === currentUser.id;
    const likes = p.likes || {};
    const liked = !!likes[currentUser.id];
    const likeCount = Object.keys(likes).length;
    const avStyle = author.avatar ? ` style="background-image:url('${author.avatar}')"` : '';
    const avContent = author.avatar ? '' : escapeHtml(firstLetter(author.name));
    return `
      <div class="post" data-post-id="${p.id}">
        <div class="post-head">
          <div class="avatar"${avStyle} data-author="${author.id}">${avContent}</div>
          <div class="meta">
            <div class="name">${escapeHtml(author.name)}${author.frozen ? ' ❄' : ''}</div>
            <div class="time">${formatTime(p.time)}</div>
          </div>
        </div>
        ${p.text ? `<div class="post-body">${escapeHtml(p.text)}</div>` : ''}
        ${p.image ? `<img class="post-image" src="${p.image}">` : ''}
        <div class="post-actions">
          <button class="${liked ? 'active' : ''}" data-like>${liked ? '❤' : '♡'} <span>${likeCount}</span></button>
          ${isMine || isAdmin() ? `<button class="danger" data-del>🗑 Удалить</button>` : ''}
        </div>
      </div>`;
  }).join('');
  list.querySelectorAll('.post').forEach(el => {
    const pid = el.dataset.postId;
    el.querySelector('[data-like]')?.addEventListener('click', () => toggleLike(pid));
    el.querySelector('[data-del]')?.addEventListener('click', () => deletePost(pid));
    el.querySelector('.post-image')?.addEventListener('click', e => openImageViewer(e.target.src));
    el.querySelector('[data-author]')?.addEventListener('click', () => openUserProfile(el.querySelector('[data-author]').dataset.author));
  });
}
async function toggleLike(pid) {
  const p = postsCache[pid]; if (!p) return;
  const likes = p.likes || {}; const liked = !!likes[currentUser.id];
  const path = `posts/${pid}/likes/${currentUser.id}`;
  if (liked) await remove(ref(db, path)); else await set(ref(db, path), true);
}
async function deletePost(pid) {
  const p = postsCache[pid]; if (!p) return;
  if (p.authorId !== currentUser.id && !isAdmin()) return;
  if (!confirm('Удалить пост?')) return;
  await remove(ref(db, 'posts/' + pid));
}

/* ============================================================
   АДМИН-ПАНЕЛЬ
   ============================================================ */
window.openAdminPanel = function() {
  if (!isAdmin()) return;
  const users = Object.values(usersCache).sort((a,b) => b.createdAt - a.createdAt);
  const frozen = users.filter(u => u.frozen).length;
  const admins = users.filter(u => u.role === 'admin').length;
  document.getElementById('modalContent').innerHTML = `
    <h2>🛡 Админ-панель</h2>
    <div class="settings-section">
      <h3>Статистика</h3>
      <div class="info-row"><span class="label">Всего пользователей</span><span class="value">${users.length}</span></div>
      <div class="info-row"><span class="label">Заморожено</span><span class="value">${frozen}</span></div>
      <div class="info-row"><span class="label">Админов</span><span class="value">${admins}</span></div>
      <div class="info-row"><span class="label">Чатов</span><span class="value">${Object.keys(chatsCache).length}</span></div>
      <div class="info-row"><span class="label">Постов</span><span class="value">${Object.keys(postsCache).length}</span></div>
    </div>
    <div class="settings-section">
      <h3>Пользователи</h3>
      <div style="max-height:400px;overflow-y:auto">
        ${users.map(u => {
          const avStyle = u.avatar ? ` style="background-image:url('${u.avatar}')"` : '';
          const avContent = u.avatar ? '' : escapeHtml(firstLetter(u.name));
          const isMe = u.id === currentUser.id;
          return `
            <div class="admin-user-row">
              <div class="avatar"${avStyle}>${avContent}</div>
              <div class="meta">
                <div class="name">${escapeHtml(u.name)}</div>
                <div class="id">${u.id}</div>
                ${u.frozen ? '<div class="status">❄ Заморожен</div>' : ''}
                ${u.role === 'admin' ? '<div class="status" style="color:#ffa726">🛡 Админ</div>' : ''}
              </div>
              <div class="actions">
                <button data-chats="${u.id}" title="Чаты">💬</button>
                ${!isMe ? `
                  <button class="${u.frozen ? 'good' : 'warn'}" data-freeze="${u.id}" title="${u.frozen ? 'Разморозить' : 'Заморозить'}">${u.frozen ? '✅' : '❄'}</button>
                  <button class="danger" data-delete="${u.id}" title="Удалить">🗑</button>
                ` : ''}
              </div>
            </div>`;
        }).join('')}
      </div>
    </div>
    <div class="close-row"><button class="cancel" onclick="closeModal()">Закрыть</button></div>`;
  document.getElementById('modalOverlay').classList.add('open');
  document.querySelectorAll('[data-freeze]').forEach(el => el.addEventListener('click', () => adminToggleFreeze(el.dataset.freeze)));
  document.querySelectorAll('[data-delete]').forEach(el => el.addEventListener('click', () => adminDeleteUser(el.dataset.delete)));
  document.querySelectorAll('[data-chats]').forEach(el => el.addEventListener('click', () => adminViewUserChats(el.dataset.chats)));
};

async function adminToggleFreeze(uid) {
  if (!isAdmin()) return;
  const u = usersCache[uid]; if (!u) return;
  if (u.role === 'admin') { showToast('Нельзя заморозить админа', true); return; }
  if (!confirm(`${u.frozen ? 'Разморозить' : 'Заморозить'} ${u.name}?`)) return;
  await update(ref(db, 'users/' + uid), { frozen: !u.frozen });
  showToast(u.frozen ? 'Разморожен' : 'Заморожен');
  openAdminPanel();
}
async function adminDeleteUser(uid) {
  if (!isAdmin()) return;
  const u = usersCache[uid]; if (!u) return;
  if (u.role === 'admin') { showToast('Нельзя удалить админа', true); return; }
  if (!confirm(`⚠️ Удалить ${u.name} (${uid})?`)) return;
  if (!confirm('Точно? Необратимо.')) return;
  showLoading(true, 'Удаление...');
  try {
    const updates = {};
    Object.keys(chatsCache).forEach(key => { if (key.includes(uid)) updates['chats/' + key] = null; });
    Object.entries(postsCache).forEach(([pid, p]) => { if (p.authorId === uid) updates['posts/' + pid] = null; });
    Object.values(usersCache).forEach(x => {
      if (x.contacts && x.contacts[uid]) updates[`users/${x.id}/contacts/${uid}`] = null;
      if (x.blocked && x.blocked[uid]) updates[`users/${x.id}/blocked/${uid}`] = null;
    });
    updates['users/' + uid] = null;
    if (u.uid) updates['uids/' + u.uid] = null;
    if (u.email) updates['email_to_id/' + u.email.toLowerCase()] = null;
    await update(ref(db), updates);
    showToast('Пользователь удалён');
    openAdminPanel();
  } catch(e) { showToast('Ошибка: ' + e.message, true); }
  finally { showLoading(false); }
}
async function adminViewUserChats(uid) {
  if (!isAdmin()) return;
  const u = usersCache[uid]; if (!u) return;
  const userChats = Object.entries(chatsCache).filter(([key]) => key.includes(uid));
  if (userChats.length === 0) { showToast('Нет чатов', true); return; }
  const html = userChats.map(([key, msgsObj]) => {
    const ids = key.split('_');
    const otherId = ids[0] === uid ? ids[1] : ids[0];
    const other = usersCache[otherId];
    const msgs = Object.values(msgsObj || {});
    return `<div class="info-row" data-chatview="${key}" style="cursor:pointer">
      <span class="label">${other ? escapeHtml(other.name) : otherId} (${otherId})</span>
      <span class="value">${msgs.length} →</span>
    </div>`;
  }).join('');
  document.getElementById('modalContent').innerHTML = `
    <h2>Чаты ${escapeHtml(u.name)}</h2>
    <p style="color:var(--text-dim);font-size:13px;margin-bottom:14px">Только просмотр</p>
    ${html}
    <div class="close-row">
      <button class="cancel" onclick="openAdminPanel()">← Назад</button>
      <button class="cancel" onclick="closeModal()">Закрыть</button>
    </div>`;
  document.querySelectorAll('[data-chatview]').forEach(el => el.addEventListener('click', () => adminOpenChatView(el.dataset.chatview)));
}
async function adminOpenChatView(key) {
  if (!isAdmin()) return;
  const msgsObj = chatsCache[key] || {};
  const msgs = Object.entries(msgsObj).map(([id, m]) => ({ id, ...m })).sort((a,b) => a.time - b.time);
  const ids = key.split('_');
  const u1 = usersCache[ids[0]], u2 = usersCache[ids[1]];
  const html = msgs.map(m => {
    const sender = usersCache[m.from];
    const name = sender ? sender.name : m.from;
    const text = m.deleted ? '<em>удалено</em>' : (m.image ? '🖼' + (m.text ? ' ' + escapeHtml(m.text) : '') : escapeHtml(m.text));
    return `<div class="admin-chat-msg"><span class="from">${escapeHtml(name)}</span><span class="time">${formatTime(m.time)}</span><div class="text">${text}</div></div>`;
  }).join('') || '<div class="empty-hint">Нет сообщений</div>';
  document.getElementById('modalContent').innerHTML = `
    <h2>💬 ${escapeHtml(u1?.name || '?')} ↔ ${escapeHtml(u2?.name || '?')}</h2>
    <div style="max-height:60vh;overflow-y:auto;background:var(--bg);border-radius:10px;padding:8px;margin-bottom:14px">${html}</div>
    <div class="close-row">
      <button class="cancel" onclick="openAdminPanel()">← Назад</button>
      <button class="cancel" onclick="closeModal()">Закрыть</button>
    </div>`;
}

window.closeModal = function() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('modalContent').innerHTML = '';
};

/* ============================================================
   АВТО-ВХОД
   ============================================================ */
(async function init() {
  await ensureAdminExists();
  onAuthStateChanged(auth, async (user) => {
    if (!user) return;
    if (!user.emailVerified) return;
    try {
      const uidSnap = await get(ref(db, 'uids/' + user.uid));
      if (!uidSnap.exists()) return;
      const userId = uidSnap.val();
      const userSnap = await get(ref(db, 'users/' + userId));
      const profile = userSnap.val();
      if (!profile) return;
      if (profile.frozen) { await signOut(auth); return; }
      if (!currentUser) {
        currentUid = user.uid;
        enterApp(profile);
      }
    } catch(e) { console.error('init:', e); }
  });
})();
</script>
